<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="1300" height="760" role="img" aria-label="No puedo entrar: primero la red, después el camino según a qué querés entrar">
<title>No puedo entrar: primero la red, después el camino según a qué querés entrar</title>
<defs><marker id="punta-424242" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#424242"/></marker><marker id="punta-2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="punta-c62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="650" y="40" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="26" font-weight="bold" font-style="normal" fill="#212121" text-anchor="middle">No puedo entrar: ¿qué puerta está cerrada?</text>
<text x="650" y="66" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#616161" text-anchor="middle">Primero, siempre, la red. Después el camino se divide: la terminal y Node-RED pasan por SSH; Grafana no.</text>
<text x="650" y="86" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#424242" text-anchor="middle">Flecha verde = sí · flecha roja = no / error</text>
<rect x="470" y="100" width="360" height="72" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
<text x="650.0" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14.5" font-weight="bold" font-style="normal" fill="#5e35b1" text-anchor="middle">¿Aparece homelab-01?</text>
<text x="650.0" y="144" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#212121" text-anchor="middle">tailscale status (en tu compu)</text>
<circle cx="470" cy="100" r="13" fill="#5e35b1"/>
<text data-num="1" x="470" y="105" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<rect x="930" y="105" width="340" height="62" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="1100.0" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#c62828" text-anchor="middle">Tailscale apagado o sin aprobar</text>
<text x="1100.0" y="151" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#424242" text-anchor="middle">o en tu propio tailnet: logout + up</text>
<line x1="830" y1="136" x2="928" y2="136" stroke="#c62828" stroke-width="2.5" marker-end="url(#punta-c62828)"/>
<rect data-fondo="1" x="863.25" y="112.5" width="31.5" height="24.5" rx="6" fill="#ffffff"/>
<text x="879" y="129" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#c62828" text-anchor="middle">NO</text>
<rect x="500" y="215" width="300" height="60" rx="10" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
<text x="650.0" y="250.075" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14.5" font-weight="bold" font-style="normal" fill="#616161" text-anchor="middle">¿A qué querés entrar?</text>
<line x1="650" y1="172" x2="650" y2="213" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#punta-2e7d32)"/>
<text x="662" y="199" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#2e7d32" text-anchor="start">sí</text>
<text x="30" y="318" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ad1457" text-anchor="start">TERMINAL o TU NODE-RED (con SSH)</text>
<line x1="560" y1="275" x2="300" y2="343" stroke="#424242" stroke-width="2.5" marker-end="url(#punta-424242)"/>
<rect x="110" y="345" width="380" height="72" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
