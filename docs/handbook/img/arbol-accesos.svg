<text x="440.0" y="496" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#424242" text-anchor="middle">contraseña del aula equivocada</text>
<line x1="220" y1="417" x2="160" y2="448" stroke="#c62828" stroke-width="2.5" marker-end="url(#punta-c62828)"/>
<line x1="380" y1="417" x2="440" y2="448" stroke="#c62828" stroke-width="2.5" marker-end="url(#punta-c62828)"/>
<rect x="110" y="560" width="380" height="72" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
<text x="300.0" y="584" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14.5" font-weight="bold" font-style="normal" fill="#ad1457" text-anchor="middle">¿Abre localhost:1880?</text>
<text x="300.0" y="604" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#212121" text-anchor="middle">con la ventana del túnel abierta</text>
<circle cx="110" cy="560" r="13" fill="#ad1457"/>
<text data-num="1" x="110" y="565" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<line x1="300" y1="417" x2="300" y2="558" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#punta-2e7d32)"/>
<text x="312" y="540" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#2e7d32" text-anchor="start">sí, entra</text>
<rect x="110" y="670" width="380" height="62" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="300.0" y="695" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#c62828" text-anchor="middle">Túnel con puertos de OTRO equipo</text>
<text x="300.0" y="716" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#424242" text-anchor="middle">o se cerró la ventana del SSH</text>
<line x1="300" y1="632" x2="300" y2="668" stroke="#c62828" stroke-width="2.5" marker-end="url(#punta-c62828)"/>
<text x="1270" y="318" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#e65100" text-anchor="end">GRAFANA DEL AULA (sin SSH: navegador)</text>
<line x1="740" y1="275" x2="1000" y2="343" stroke="#424242" stroke-width="2.5" marker-end="url(#punta-424242)"/>
<rect x="810" y="345" width="380" height="72" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="1000.0" y="369" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14.5" font-weight="bold" font-style="normal" fill="#e65100" text-anchor="middle">¿Abre grafana-aula… ?</text>
<text x="1000.0" y="389" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#212121" text-anchor="middle">en el navegador · login del aula</text>
<circle cx="810" cy="345" r="13" fill="#e65100"/>
<text data-num="1" x="810" y="350" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<rect x="700" y="450" width="290" height="62" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="845.0" y="475" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#c62828" text-anchor="middle">No carga</text>
<text x="845.0" y="496" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#424242" text-anchor="middle">¿Tailscale prendido?</text>
<rect x="1010" y="450" width="270" height="62" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="1145.0" y="475" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#c62828" text-anchor="middle">Vuelve al login</text>
<text x="1145.0" y="496" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#424242" text-anchor="middle">usuario/contraseña del aula</text>
<line x1="920" y1="417" x2="845" y2="448" stroke="#c62828" stroke-width="2.5" marker-end="url(#punta-c62828)"/>
<line x1="1080" y1="417" x2="1145" y2="448" stroke="#c62828" stroke-width="2.5" marker-end="url(#punta-c62828)"/>
<rect x="810" y="560" width="380" height="62" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="1000.0" y="585" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#c62828" text-anchor="middle">Entra, pero no ves tu carpeta</text>
<text x="1000.0" y="606" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#424242" text-anchor="middle">no estás en el roster del equipo: avisá</text>
<line x1="1000" y1="417" x2="1000" y2="558" stroke="#c62828" stroke-width="2.5" marker-end="url(#punta-c62828)"/>
