# nginx de equipo-NN: sirve tu UI y hace de puente a Node-RED.
# Por qué el puente: así tu página y la API salen del MISMO origen
# (localhost:8080), sin pelear con CORS ni abrir otro túnel.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Tu UI: cualquier archivo de /srv/classroom/equipo-NN/web
    location / {
        try_files $uri $uri/ =404;
    }

    # Endpoints HTTP que armes en Node-RED con nodos "http in" (/api/...)
    location /api/ {
        proxy_pass http://nodered:1880;
    }

    # WebSockets de Node-RED (nodos "websocket", /ws/...): datos en vivo
    location /ws/ {
        proxy_pass http://nodered:1880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
