---
# Capa de visualización MQTT del aula. Ver docs/aula-iot.md.
#
# Orden: secretos -> archivos -> stack -> Grafana por API (usuarios, equipos,
# folders, permisos, dashboard inicial). Todo sale del roster de classroom.yml:
# sumar un equipo o un alumno ahí y correr `--tags classroom` alcanza.

# --- Secretos -------------------------------------------------------------------
# Las claves MQTT de servicio las genera shared_services; acá solo se leen, así
# este rol también corre solo (`--tags aula-iot`).
- name: Read MQTT service user passwords (aula-telegraf, aula-exporter)
  ansible.builtin.slurp:
    src: "{{ shared_services_secrets_dir }}/{{ item }}.mqttpass"
  loop: [aula-telegraf, aula-exporter]
  register: aula_svc_pass
  no_log: true
  when: aula_iot_enabled | bool

- name: Generate the grafana-aula admin password (once)
  ansible.builtin.shell:
    cmd: "printf %s \"$(openssl rand -hex 20)\" > {{ shared_services_secrets_dir }}/grafana-aula.adminpass"
    creates: "{{ shared_services_secrets_dir }}/grafana-aula.adminpass"
  args:
    executable: /bin/bash
  when: aula_iot_enabled | bool

- name: Read the grafana-aula admin password
  ansible.builtin.slurp:
    src: "{{ shared_services_secrets_dir }}/grafana-aula.adminpass"
  register: aula_grafana_adminpass
  no_log: true
  when: aula_iot_enabled | bool

- name: Index the service passwords by user
  ansible.builtin.set_fact:
    aula_svc: "{{ dict(aula_svc_pass.results | map(attribute='item') | zip(aula_svc_pass.results | map(attribute='content') | map('b64decode'))) }}"
  no_log: true
  when: aula_iot_enabled | bool

# --- Archivos del stack -------------------------------------------------------------
- name: Deploy the aula-iot stack files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose/aula-iot/"
    dest: "{{ aula_iot_dir }}/"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
    directory_mode: "0755"
  notify: Restart aula-iot
  when: aula_iot_enabled | bool

- name: Render aula-iot .env (secrets)
  ansible.builtin.template:
    src: aula-iot.env.j2
    dest: "{{ aula_iot_dir }}/.env"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  no_log: true
  notify: Restart aula-iot
  when: aula_iot_enabled | bool

- name: Render telegraf.conf (one topic per team of the roster)
  ansible.builtin.template:
    src: telegraf.conf.j2
    dest: "{{ aula_iot_dir }}/telegraf/telegraf.conf"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  notify: Restart aula-iot
  when: aula_iot_enabled | bool

# Git no guarda carpetas vacías: esta solo tiene lo que se genera acá, así que
# en un checkout limpio no existe (pasó en el primer despliegue).
- name: Ensure the Grafana datasources dir exists
  ansible.builtin.file:
    path: "{{ aula_iot_dir }}/grafana/provisioning/datasources"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  when: aula_iot_enabled | bool

- name: Render Grafana datasources (one per team)
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ aula_iot_dir }}/grafana/provisioning/datasources/aula.yml"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  notify: Restart aula-iot
  when: aula_iot_enabled | bool

- name: Bring up the aula-iot stack
  community.docker.docker_compose_v2:
    project_src: "{{ aula_iot_dir }}"
    state: present
    pull: missing
  when: aula_iot_enabled | bool

- name: Apply pending restarts before talking to Grafana
  ansible.builtin.meta: flush_handlers

- name: Wait for grafana-aula
  ansible.builtin.uri:
    url: "{{ aula_iot_grafana_api }}/api/health"
  register: aula_grafana_health
  until: aula_grafana_health.status == 200
  retries: 30
  delay: 3
  when: aula_iot_enabled | bool

# --- Grafana: una organización por equipo -----------------------------------------
# Todo el trabajo con la API lo hace files/aula_grafana.py (idempotente, con
# tests): usuarios, una org por equipo con su fuente filtrada y su tablero,
# integrantes como Editor, y migración desde el diseño anterior (carpetas en la
# org 1). Por qué organizaciones: Grafana OSS no tiene permisos por fuente de
# datos; ver el docstring del script y docs/aula-iot.md.
- name: Install the Grafana org sync script
  ansible.builtin.copy:
    src: aula_grafana.py
    dest: /usr/local/lib/aula-grafana.py
    owner: root
    group: root
    mode: "0755"
  when: aula_iot_enabled | bool

- name: Sync Grafana organizations with the roster
  ansible.builtin.command: /usr/bin/python3 /usr/local/lib/aula-grafana.py
  args:
    stdin: "{{ aula_grafana_cfg | to_json }}"
  vars:
    aula_grafana_cfg:
      api: "{{ aula_iot_grafana_api }}"
      operador: "{{ aula_iot_grafana_admin }}"
      clave_operador: "{{ aula_grafana_adminpass.content | b64decode }}"
      nombre_org_operador: "{{ aula_iot_org_operador }}"
      vm_url: "http://aula-victoriametrics:8428"
      tablero_inicial: "{{ lookup('ansible.builtin.file', 'equipo-dashboard.json') }}"
      equipos: "{{ classroom_teams }}"
      nombres: "{{ sso_users | items2dict(key_name='username', value_name='displayname') }}"
  register: aula_grafana_sync
  changed_when: (aula_grafana_sync.stdout | from_json).changed
  no_log: true
  when: aula_iot_enabled | bool

# El paso de arriba va con no_log (lleva la clave del admin); acá solo la lista
# de cambios, que no tiene secretos.
- name: Report Grafana changes
  ansible.builtin.debug:
    msg: "{{ (aula_grafana_sync.stdout | from_json).cambios | default(['sin cambios'], true) }}"
  when: aula_iot_enabled | bool
