---
# Deploy the shared data services and provision one Postgres database + role and
# one Redis logical DB per team, then drop a credentials env file into each team
# directory. labctld connects these services to each team's private network at
# `up` time, so teams reach them without seeing one another.
- name: Deploy the shared-data stack
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose/shared-data/"
    dest: "{{ stacks_root }}/shared-data/"
    mode: "0644"
    directory_mode: "0750"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
  when: shared_services_enabled | bool and (classroom_teams | length > 0)

- name: Render shared-data .env (Postgres superuser password)
  ansible.builtin.template:
    src: shared-data.env.j2
    dest: "{{ stacks_root }}/shared-data/.env"
    mode: "0600"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
  no_log: true
  when: shared_services_enabled | bool and (classroom_teams | length > 0)

- name: Install psycopg2 for Postgres provisioning
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present
  when: shared_services_enabled | bool and (classroom_teams | length > 0)

- name: Ensure per-team DB password store exists (root only)
  ansible.builtin.file:
    path: "{{ shared_services_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: shared_services_enabled | bool and (classroom_teams | length > 0)

# MQTT credential per team, generated once and stored root-only (same pattern as
# the DB password). It is the team's login on the classroom broker (mqtt-aula) and
# lands in .shared-services.env, so adding a team never touches the vault.
- name: Generate an MQTT password per team (once)
  ansible.builtin.shell:
    cmd: "printf %s \"$(openssl rand -hex 16)\" > {{ shared_services_secrets_dir }}/{{ item.name }}.mqttpass"
    creates: "{{ shared_services_secrets_dir }}/{{ item.name }}.mqttpass"
  args:
    executable: /bin/bash
  loop: "{{ classroom_teams }}"
  loop_control:
    label: "{{ item.name }}"
  when: shared_services_enabled | bool

- name: Read per-team MQTT passwords
  ansible.builtin.slurp:
    src: "{{ shared_services_secrets_dir }}/{{ item.name }}.mqttpass"
  loop: "{{ classroom_teams }}"
  loop_control:
    label: "{{ item.name }}"
  register: team_mqttpass
  no_log: true
  when: shared_services_enabled | bool

# --- Broker MQTT del aula (mqtt-aula) ---------------------------------------
# passwd y acl tienen que existir ANTES de levantar el stack: si falta el archivo
# de un bind mount, Docker crea un directorio en su lugar y Mosquitto no arranca.
- name: Ensure the mqtt-aula config dir exists
  ansible.builtin.file:
    path: "{{ stacks_root }}/shared-data/mosquitto"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0750"
  when: shared_services_enabled | bool and (classroom_teams | length > 0)

- name: Render the mqtt-aula ACL (each team confined to <team>/#)
  ansible.builtin.template:
    src: mqtt-aula-acl.j2
    dest: "{{ stacks_root }}/shared-data/mosquitto/acl"
    owner: "1883"
    group: "1883"
    mode: "0640"
  notify: Reload mqtt-aula
  when: shared_services_enabled | bool and (classroom_teams | length > 0)

- name: Write the mqtt-aula user list (root only)
  ansible.builtin.copy:
    content: |
      {% for r in team_mqttpass.results %}
      {{ r.item.name | replace('-', '_') }}	{{ r.content | b64decode }}
      {% endfor %}
    dest: "{{ shared_services_secrets_dir }}/mqtt-aula-users.tsv"
    owner: root
    group: root
    mode: "0600"
  register: shared_mqtt_userlist
  no_log: true
  when: shared_services_enabled | bool and (classroom_teams | length > 0)

- name: Check whether the mqtt-aula password file exists
  ansible.builtin.stat:
    path: "{{ stacks_root }}/shared-data/mosquitto/passwd"
  register: shared_mqtt_passwd_file
  when: shared_services_enabled | bool and (classroom_teams | length > 0)

# mosquitto_passwd hashea con salt aleatorio: se reconstruye solo si cambió la
# lista de equipos/claves o falta el archivo, para no romper la idempotencia.
- name: Build the mqtt-aula password file (hashed with mosquitto_passwd)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      work="$(mktemp -d -p {{ shared_services_secrets_dir }})"
      trap 'rm -rf "$work"' EXIT
      : > "$work/passwd"
      while IFS=$'\t' read -r usuario clave; do
        [ -n "$usuario" ] || continue
        docker run --rm --user 0:0 --entrypoint mosquitto_passwd \
          -v "$work":/work {{ shared_mqtt_image }} \
          -b /work/passwd "$usuario" "$clave"
      done < {{ shared_services_secrets_dir }}/mqtt-aula-users.tsv
      install -o 1883 -g 1883 -m 0640 "$work/passwd" {{ stacks_root }}/shared-data/mosquitto/passwd
  args:
    executable: /bin/bash
  when:
    - shared_services_enabled | bool and (classroom_teams | length > 0)
    - shared_mqtt_userlist is changed or not (shared_mqtt_passwd_file.stat.exists | default(false))
  changed_when: true
  no_log: true
  notify: Reload mqtt-aula

- name: Bring up the shared-data stack
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_root }}/shared-data"
    state: present
    pull: missing
  when: shared_services_enabled | bool and (classroom_teams | length > 0)

- name: Wait for Postgres to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 5432
    timeout: 90
  when: shared_services_enabled | bool and (classroom_teams | length > 0)

# Generated on the host (as root) so the secret store stays root-only; the
# `password` lookup runs on the controller and could not write there.
- name: Generate a Postgres password per team (once)
  ansible.builtin.shell:
    cmd: "printf %s \"$(openssl rand -hex 16)\" > {{ shared_services_secrets_dir }}/{{ item.name }}.pgpass"
    creates: "{{ shared_services_secrets_dir }}/{{ item.name }}.pgpass"
  args:
    executable: /bin/bash
  loop: "{{ classroom_teams }}"
  loop_control:
    label: "{{ item.name }}"
  when: shared_services_enabled | bool

- name: Read per-team DB passwords
  ansible.builtin.slurp:
    src: "{{ shared_services_secrets_dir }}/{{ item.name }}.pgpass"
  loop: "{{ classroom_teams }}"
  loop_control:
    label: "{{ item.name }}"
  register: team_pgpass
  no_log: true
  when: shared_services_enabled | bool

- name: Create a Postgres role per team
  community.postgresql.postgresql_user:
    login_host: "127.0.0.1"
    login_user: postgres
    login_password: "{{ vault_postgres_superuser_password }}"
    name: "{{ item.item.name | replace('-', '_') }}"
    password: "{{ item.content | b64decode }}"
  loop: "{{ team_pgpass.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true
  when: shared_services_enabled | bool

- name: Create a database per team (owned by the team role)
  community.postgresql.postgresql_db:
    login_host: "127.0.0.1"
    login_user: postgres
    login_password: "{{ vault_postgres_superuser_password }}"
    name: "db_{{ item.item.name | replace('-', '_') }}"
    owner: "{{ item.item.name | replace('-', '_') }}"
  loop: "{{ team_pgpass.results }}"
  loop_control:
    label: "db_{{ item.item.name | replace('-', '_') }}"
  no_log: true
  when: shared_services_enabled | bool

- name: Render each team's shared-services credentials file
  ansible.builtin.template:
    src: team-shared-services.env.j2
    dest: "{{ classroom_root }}/{{ item.item.name }}/.shared-services.env"
    owner: root
    group: "grp-{{ item.item.name }}"
    mode: "0640"
  loop: "{{ team_pgpass.results }}"
  loop_control:
    label: "{{ item.item.name }}"
    index_var: team_index
  no_log: true
  when: shared_services_enabled | bool

# --- Funnel: los dispositivos llegan a mqtt-aula desde cualquier red ----------
# TLS lo termina Tailscale; el broker exige usuario/clave igual. Se chequea el
# puerto puntual (no solo "Funnel on"): el 8443 del pañol ya lo tiene prendido.
- name: Check Tailscale Funnel status (mqtt-aula)
  ansible.builtin.command: tailscale funnel status
  register: shared_mqtt_funnel_status
  changed_when: false
  failed_when: false
  when: shared_services_enabled | bool and shared_mqtt_funnel_enabled | bool

- name: Publish mqtt-aula through Funnel (TLS-terminated TCP)
  ansible.builtin.command: >-
    tailscale funnel --bg --tls-terminated-tcp={{ shared_mqtt_funnel_port }}
    tcp://127.0.0.1:{{ shared_mqtt_host_port }}
  register: shared_mqtt_funnel_enable
  changed_when: shared_mqtt_funnel_enable.rc == 0
  failed_when:
    - shared_mqtt_funnel_enable.rc != 0
    - "'not enabled on your tailnet' not in (shared_mqtt_funnel_enable.stderr | default(''))"
  when:
    - shared_services_enabled | bool and shared_mqtt_funnel_enabled | bool
    - ("127.0.0.1:" ~ shared_mqtt_host_port) not in (shared_mqtt_funnel_status.stdout | default(''))
