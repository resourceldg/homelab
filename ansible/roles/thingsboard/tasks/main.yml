---
# ThingsBoard CE: stack propio + aprovisionamiento + respaldo + acceso admin.
# Ver docs/thingsboard.md. Orden:
#   chequeos -> secretos -> archivos -> instalación (solo la 1.ª vez) -> stack ->
#   aprovisionamiento (tenant, gateway, dashboards, lo público) -> respaldo ->
#   vhost de administración (Caddy principal) -> verificación.
#
# NO toca: Grafana, VictoriaMetrics, Node-RED, el Postgres compartido, ni el
# 443 del tailnet. Las cuentas de mqtt-aula (tb-puente, tb-demo) las crea
# shared_services, como las de los demás servicios.

- name: Stop here if ThingsBoard is disabled
  ansible.builtin.meta: end_role
  when: not (thingsboard_enabled | bool)

# --- Chequeos ---------------------------------------------------------------------
- name: Check that the external docker networks exist (edge, classroom-shared)
  community.docker.docker_network_info:
    name: "{{ item }}"
  loop: [edge, classroom-shared]
  register: thingsboard_redes

- name: Fail early if a network is missing
  ansible.builtin.assert:
    that: thingsboard_redes.results | map(attribute='exists') | min
    fail_msg: >-
      Falta la red {{ thingsboard_redes.results | rejectattr('exists') | map(attribute='item') | join(', ') }}.
      ThingsBoard se apoya en el proxy (edge) y en mqtt-aula (classroom-shared):
      correr antes --tags docker,monitoring,classroom.

- name: Check the bridge's MQTT credentials (created by shared_services)
  ansible.builtin.stat:
    path: "{{ shared_services_secrets_dir }}/{{ item }}.mqttpass"
  loop: "{{ ['tb-puente'] + (['tb-demo'] if thingsboard_demo_enabled | bool else []) }}"
  register: thingsboard_mqttpass_files

- name: Fail if mqtt-aula does not have the bridge accounts yet
  ansible.builtin.assert:
    that: thingsboard_mqttpass_files.results | map(attribute='stat.exists') | min
    fail_msg: >-
      Faltan las cuentas de mqtt-aula del puente (tb-puente / tb-demo). Correr
      primero --tags shared-services (las da de alta y reinicia mqtt-aula: las
      placas se reconectan solas en segundos).

# --- Secretos (se sortean EN EL HOST, una vez) ------------------------------------
- name: Ensure the ThingsBoard config dirs exist (root only)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ thingsboard_config_dir }}"
    - "{{ thingsboard_secrets_dir }}"

- name: Generate the secrets (once; delete a file to rotate it)
  ansible.builtin.shell:
    cmd: "umask 077; {{ item.cmd }} > {{ thingsboard_secrets_dir }}/{{ item.file }}"
    creates: "{{ thingsboard_secrets_dir }}/{{ item.file }}"
  args:
    executable: /bin/bash
  loop:
    - { file: db.pass, cmd: "printf %s \"$(openssl rand -hex 24)\"" }
    - { file: monitoreo.pass, cmd: "printf %s \"$(openssl rand -hex 24)\"" }
    # Firma de las sesiones (JWT). La de fábrica es pública.
    - { file: jwt.key, cmd: "printf %s \"$(openssl rand -base64 64 | tr -d '\\n')\"" }
    - { file: sysadmin.pass, cmd: "printf %s \"$(openssl rand -hex 16)\"" }
    - { file: admin.pass, cmd: "printf %s \"$(openssl rand -hex 16)\"" }
    - { file: gateway.token, cmd: "printf %s \"$(openssl rand -hex 32)\"" }
  loop_control:
    label: "{{ item.file }}"

- name: Read the secrets
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ thingsboard_secrets_dir }}/db.pass"
    - "{{ thingsboard_secrets_dir }}/jwt.key"
    - "{{ thingsboard_secrets_dir }}/gateway.token"
    - "{{ shared_services_secrets_dir }}/tb-puente.mqttpass"
    - "{{ thingsboard_secrets_dir }}/monitoreo.pass"
  register: thingsboard_sec
  no_log: true

- name: Read the demo MQTT password
  ansible.builtin.slurp:
    src: "{{ shared_services_secrets_dir }}/tb-demo.mqttpass"
  register: thingsboard_demo_pass
  no_log: true
  when: thingsboard_demo_enabled | bool

- name: Check for the Tailscale auth key (public node)
  ansible.builtin.stat:
    path: "{{ thingsboard_secrets_dir }}/tailscale.authkey"
  register: thingsboard_authkey_file

- name: Check whether the public node already joined (state volume)
  ansible.builtin.command: docker volume inspect thingsboard_tableros_ts
  register: thingsboard_ts_state
  changed_when: false
  failed_when: false

- name: Read the Tailscale auth key
  ansible.builtin.slurp:
    src: "{{ thingsboard_secrets_dir }}/tailscale.authkey"
  register: thingsboard_authkey
  no_log: true
  when: thingsboard_authkey_file.stat.exists

- name: Decide the compose profiles
  ansible.builtin.set_fact:
    thingsboard_db_password: "{{ thingsboard_sec.results[0].content | b64decode }}"
    thingsboard_jwt_key: "{{ thingsboard_sec.results[1].content | b64decode }}"
    thingsboard_gateway_token: "{{ thingsboard_sec.results[2].content | b64decode }}"
    thingsboard_puente_mqtt_pass: "{{ thingsboard_sec.results[3].content | b64decode }}"
    thingsboard_monitoreo_password: "{{ thingsboard_sec.results[4].content | b64decode }}"
    thingsboard_demo_mqtt_pass: "{{ thingsboard_demo_pass.content | b64decode if thingsboard_demo_enabled | bool else '' }}"
    thingsboard_ts_authkey: "{{ thingsboard_authkey.content | b64decode | trim if thingsboard_authkey_file.stat.exists else '' }}"
    # El nodo público arranca si está pedido Y (hay auth key O ya se unió antes).
    thingsboard_profiles: >-
      {{ (['demo'] if thingsboard_demo_enabled | bool else [])
         + (['publico'] if thingsboard_publico_enabled | bool
            and (thingsboard_authkey_file.stat.exists or thingsboard_ts_state.rc == 0) else []) }}
  no_log: true

- name: Warn if publishing was requested without an auth key
  ansible.builtin.debug:
    msg: >-
      thingsboard_publico_enabled está en true pero no hay auth key en
      {{ thingsboard_secrets_dir }}/tailscale.authkey (ni el nodo se unió antes):
      el nodo "tableros" NO se levanta. Ver docs/thingsboard.md, "Publicar".
  when:
    - thingsboard_publico_enabled | bool
    - "'publico' not in thingsboard_profiles"

# --- Archivos -----------------------------------------------------------------------
- name: Deploy the stack files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose/thingsboard/"
    dest: "{{ thingsboard_stack_dir }}/"
    owner: root
    group: "{{ admin_user }}"
    mode: "0644"
    directory_mode: "0755"
  register: thingsboard_files

- name: Render the stack .env (secrets, root only)
  ansible.builtin.template:
    src: thingsboard.env.j2
    dest: "{{ thingsboard_stack_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  register: thingsboard_env
  no_log: true

- name: Ensure the backup and front-page dirs exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    # pg_dump corre DENTRO de tb-postgres vía `docker exec` (como root): el
    # volcado tiene TODOS los datos, así que solo root lo lee.
    - { path: "{{ thingsboard_backup_dir }}", owner: root, group: root, mode: "0700" }
    - { path: "{{ thingsboard_portada_dir }}", owner: root, group: root, mode: "0755" }

# --- Instalación (solo si la base está vacía) ---------------------------------------
- name: Bring up the database first
  community.docker.docker_compose_v2:
    project_src: "{{ thingsboard_stack_dir }}"
    services: [tb-postgres]
    state: present
    wait: true
    wait_timeout: 120

# Rol de SOLO monitoreo para postgres-exporter (pg_monitor: estadísticas y
# tamaños, sin leer datos). Idempotente: crea o actualiza la clave.
- name: Ensure the read-only monitoring role exists in the ThingsBoard database
  ansible.builtin.command:
    # Por stdin (no -c): -c no admite mezclar SQL con \gexec ni interpola
    # variables de psql. La clave entra como variable, nunca en el comando.
    argv: [docker, exec, -i, tb-postgres, psql, -U, thingsboard, -d, thingsboard,
           -v, ON_ERROR_STOP=1, -v, "clave={{ thingsboard_monitoreo_password }}"]
    stdin: |
      SELECT format(CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'monitoreo')
                    THEN 'ALTER ROLE monitoreo LOGIN PASSWORD %L'
                    ELSE 'CREATE ROLE monitoreo LOGIN PASSWORD %L' END, :'clave') \gexec
      GRANT pg_monitor TO monitoreo;
  changed_when: false
  no_log: true

- name: Check whether ThingsBoard is already installed
  ansible.builtin.command: >-
    docker exec tb-postgres psql -U thingsboard -d thingsboard -Atc
    "select to_regclass('public.tb_schema_settings') is not null"
  register: thingsboard_instalado
  changed_when: false

# Crea el esquema y los widgets del sistema (~1,5–3 min, 1 núcleo). NO carga la
# demo de fábrica. Nunca corre sobre una base que ya tiene datos.
- name: Install ThingsBoard (first time only)
  ansible.builtin.command:
    cmd: docker compose run --rm -e INSTALL_TB=true -e LOAD_DEMO=false thingsboard
    chdir: "{{ thingsboard_stack_dir }}"
  when: thingsboard_instalado.stdout | trim != 't'
  changed_when: true

# --- Stack ---------------------------------------------------------------------------
- name: Bring up the ThingsBoard stack
  community.docker.docker_compose_v2:
    project_src: "{{ thingsboard_stack_dir }}"
    profiles: "{{ thingsboard_profiles }}"
    state: present
    build: policy
    pull: missing
    # Si cambió la config, recrear lo que corresponda (compose lo decide).
    recreate: auto

- name: Wait for ThingsBoard to answer (JVM start + migrations)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ thingsboard_http_port }}/login"
    status_code: 200
  register: thingsboard_web
  until: thingsboard_web.status == 200
  retries: 60
  delay: 5

# --- Aprovisionamiento -----------------------------------------------------------------
- name: Install the provisioning script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose/thingsboard/provision/tb-provision.py"
    dest: /usr/local/sbin/tb-provision
    owner: root
    group: root
    mode: "0750"

- name: Render the provisioning config (projects, public flags, secret paths)
  ansible.builtin.template:
    src: tableros.json.j2
    dest: "{{ thingsboard_config_dir }}/tableros.json"
    owner: root
    group: root
    mode: "0600"

- name: Provision tenant, gateway, dashboards and what is public
  ansible.builtin.command: /usr/local/sbin/tb-provision --config {{ thingsboard_config_dir }}/tableros.json
  register: thingsboard_provision
  changed_when: thingsboard_provision.stdout is search('creo|actualizo|publico|despublico|retiro|reemplazada|activado|perfil de tenant|token actualizado')

- name: Show what provisioning did
  ansible.builtin.debug:
    var: thingsboard_provision.stdout_lines

# --- Respaldo -----------------------------------------------------------------------------
- name: Install the backup script
  ansible.builtin.template:
    src: tb-backup.sh.j2
    dest: /usr/local/sbin/tb-backup
    owner: root
    group: root
    mode: "0750"

- name: Install the backup units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [tb-backup.service, tb-backup.timer]
  register: thingsboard_units

- name: Enable the daily backup timer
  ansible.builtin.systemd:
    name: tb-backup.timer
    enabled: true
    state: started
    daemon_reload: "{{ thingsboard_units is changed }}"

# --- Administración por el Caddy principal (tailnet + Authelia) --------------------------
- name: Render the admin vhost for the main Caddy
  ansible.builtin.template:
    src: thingsboard.caddy.j2
    dest: "{{ stacks_root }}/proxy/conf.d/thingsboard.caddy"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  notify: Reload main caddy

# --- Verificación -----------------------------------------------------------------------------
- name: Check every container of the stack is healthy
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ thingsboard_formato_salud }}",
           thingsboard, tb-postgres, tb-puente, tableros-proxy]
  vars:
    thingsboard_formato_salud: "{% raw %}{{.Name}} {{.State.Health.Status}}{% endraw %}"
  register: thingsboard_salud
  until: thingsboard_salud.stdout_lines | select('search', ' healthy$') | list | length == 4
  retries: 24
  delay: 5
  changed_when: false
