# Watchdog de HARDWARE (chip iTCO de la placa madre). systemd le da una señal
# periódica; si el sistema se congela y deja de darla, el chip REINICIA el equipo
# a los 30 s. Ante un congelamiento total, es lo único que puede actuar: ningún
# programa corre en una máquina congelada.
#   RuntimeWatchdogSec: tiempo sin señal hasta el reinicio (en marcha).
#   RebootWatchdogSec:  si un reinicio se cuelga, el chip lo fuerza a los 5 min.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=5min
