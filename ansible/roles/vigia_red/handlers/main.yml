---
- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

# daemon-reexec relee system.conf.d (RuntimeWatchdogSec) sin reiniciar el equipo.
- name: Reexec systemd
  ansible.builtin.systemd_service:
    daemon_reexec: true

- name: Reload NetworkManager config
  ansible.builtin.command: nmcli general reload conf
  changed_when: true

# logind relee su configuración con SIGHUP, sin cerrar sesiones.
- name: Reload logind
  ansible.builtin.command: systemctl kill -s HUP systemd-logind
  changed_when: true

- name: Apply the turbo setting
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/vigia-sin-turbo.conf
  changed_when: true
