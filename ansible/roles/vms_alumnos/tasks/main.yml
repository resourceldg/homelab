---
# Tres partes: (1) Incus instalado e inicializado, (2) el firewall que encierra
# a las VMs (solo internet), (3) las VMs de vms_alumnos.

# --- 1. Incus ------------------------------------------------------------------
- name: Install Incus and the VM stack (QEMU + UEFI firmware)
  ansible.builtin.apt:
    name: [incus, qemu-system-x86, ovmf]
    state: present

- name: Ensure Incus is running
  ansible.builtin.service:
    name: incus
    state: started
    enabled: true

# Si ya hay un pool de almacenamiento, Incus ya fue inicializado: el preseed no
# se vuelve a aplicar (pisaría la red/pool en uso).
- name: Check whether Incus is already initialized
  ansible.builtin.command: incus storage list --format csv
  register: vms_incus_pools
  changed_when: false

- name: Initialize Incus (bridge with NAT + dir storage pool)
  ansible.builtin.command: incus admin init --preseed
  args:
    stdin: "{{ lookup('ansible.builtin.template', 'preseed.yml.j2') }}"
  when: vms_incus_pools.stdout | trim | length == 0
  changed_when: true

# --- 2. Firewall: las VMs solo salen a internet ----------------------------------
# UFW niega todo lo entrante y todo lo ruteado por defecto. Al puente se le abre lo
# mínimo para que la VM arranque (DHCP y DNS del propio Incus) y nada más: una VM
# con root no llega por SSH ni a ningún servicio de homelab-01.
- name: Let VMs reach Incus DHCP on the bridge
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ vms_alumnos_bridge }}"
    port: "67"
    proto: udp
    comment: "VMs alumnos: DHCP"

- name: Let VMs reach Incus DNS on the bridge
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ vms_alumnos_bridge }}"
    port: "53"
    proto: "{{ item }}"
    comment: "VMs alumnos: DNS"
  loop: [udp, tcp]

# El orden importa: UFW evalúa las reglas en orden, así que primero los "deny" a
# las redes privadas y recién después el "allow" general. Esto también tapa el
# atajo de Docker: un puerto publicado (p. ej. Caddy) se reescribe (DNAT) a una IP
# 172.x antes de pasar por acá, y 172.16.0.0/12 está negado.
- name: Block VMs from the LAN, Docker networks and the tailnet
  community.general.ufw:
    rule: deny
    route: true
    interface_in: "{{ vms_alumnos_bridge }}"
    dest: "{{ item }}"
    comment: "VMs alumnos: sin redes privadas"
  loop: "{{ vms_alumnos_blocked_nets }}"

- name: Let VMs out to the internet
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ vms_alumnos_bridge }}"
    comment: "VMs alumnos: salida a internet"

# --- 3. Las VMs ---------------------------------------------------------------------
- name: Warn about VMs without SSH keys (they are skipped)
  ansible.builtin.debug:
    msg: >-
      La VM {{ item.name }} ({{ item.owner }}) no tiene ssh_pubkeys: NO se crea.
      Pedile al alumno su llave pública (~/.ssh/id_ed25519.pub) y agregala.
  loop: "{{ vms_alumnos | rejectattr('ssh_pubkeys', 'defined') | list
            + vms_alumnos | selectattr('ssh_pubkeys', 'defined')
                          | rejectattr('ssh_pubkeys') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check which VMs already exist
  ansible.builtin.command: incus list --format csv --columns n
  register: vms_existing
  changed_when: false

# Se crea con `init` (sin arrancar) para fijarle la IP antes del primer arranque.
# cloud-init lee user-data una sola vez: cambiarlo después no toca una VM creada.
- name: Create missing VMs
  ansible.builtin.command:
    argv:
      - incus
      - init
      - "{{ item.image | default(vms_alumnos_image) }}"
      - "{{ item.name }}"
      - --vm
      - --config
      - "limits.cpu={{ item.cpus | default(vms_alumnos_cpus) }}"
      - --config
      - "limits.memory={{ item.memory | default(vms_alumnos_memory) }}"
      - --config
      - boot.autostart=true
      - --config
      - "cloud-init.user-data={{ lookup('ansible.builtin.template', 'user-data.yml.j2') }}"
      - --device
      - "root,size={{ item.disk | default(vms_alumnos_disk) }}"
  loop: "{{ vms_alumnos | selectattr('ssh_pubkeys', 'defined') | selectattr('ssh_pubkeys') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in vms_existing.stdout_lines
  register: vms_created
  changed_when: true

- name: Pin each new VM to its fixed IP
  ansible.builtin.command:
    argv: [incus, config, device, override, "{{ item.item.name }}", eth0, "ipv4.address={{ item.item.ip }}"]
  loop: "{{ vms_created.results | selectattr('changed', 'defined') | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: true

- name: Start new VMs
  ansible.builtin.command:
    argv: [incus, start, "{{ item.item.name }}"]
  loop: "{{ vms_created.results | selectattr('changed', 'defined') | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: true

# --- 4. Monitoreo: métricas de las VMs para Prometheus ------------------------------
# Incus las sirve en /1.0/metrics y exige un certificado de cliente de tipo
# "metrics" (solo puede leer métricas, no administrar nada). Prometheus corre como
# `nobody` (65534) en su contenedor, por eso la llave es de ese grupo.
- name: Ensure the metrics certificate directory exists
  ansible.builtin.file:
    path: "{{ vms_alumnos_metrics_dir }}"
    state: directory
    owner: root
    group: "65534"
    mode: "0750"
  when: vms_alumnos_metrics_enabled | bool

- name: Generate Prometheus' client certificate for Incus metrics
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - ec
      - -pkeyopt
      - ec_paramgen_curve:secp384r1
      - -sha384
      - -nodes
      - -days
      - "3650"
      - -subj
      - /CN=prometheus-homelab
      - -keyout
      - "{{ vms_alumnos_metrics_dir }}/client.key"
      - -out
      - "{{ vms_alumnos_metrics_dir }}/client.crt"
    creates: "{{ vms_alumnos_metrics_dir }}/client.crt"
  when: vms_alumnos_metrics_enabled | bool

# Permisos explícitos: openssl los crea según el umask (quedaban root:root 0640 y
# Prometheus, que corre como nobody, no podía leer el certificado).
- name: Let Prometheus read the client certificate and key
  ansible.builtin.file:
    path: "{{ vms_alumnos_metrics_dir }}/{{ item }}"
    owner: root
    group: "65534"
    mode: "0640"
  loop: [client.crt, client.key]
  when: vms_alumnos_metrics_enabled | bool

# El certificado del servidor Incus es autofirmado y dice "homelab-01": con una
# copia, Prometheus lo verifica (ca_file + server_name) en vez de confiar a ciegas.
- name: Publish the Incus server certificate for Prometheus to verify
  ansible.builtin.copy:
    src: /var/lib/incus/server.crt
    dest: "{{ vms_alumnos_metrics_dir }}/incus-server.crt"
    remote_src: true
    owner: root
    group: "65534"
    mode: "0644"
  when: vms_alumnos_metrics_enabled | bool

- name: List the certificates Incus trusts
  ansible.builtin.command: incus config trust list --format csv
  register: vms_trust
  changed_when: false
  when: vms_alumnos_metrics_enabled | bool

- name: Trust Prometheus' certificate (metrics only)
  ansible.builtin.command:
    argv:
      - incus
      - config
      - trust
      - add-certificate
      - "{{ vms_alumnos_metrics_dir }}/client.crt"
      - --type=metrics
      - --name=prometheus-homelab
  when:
    - vms_alumnos_metrics_enabled | bool
    - "'prometheus-homelab' not in vms_trust.stdout"
  changed_when: true

# docker0 tiene que existir antes de que Incus intente escuchar en su IP; si no,
# después de un reinicio Incus arranca sin el puerto de métricas.
- name: Ensure the Incus drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/incus.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: vms_alumnos_metrics_enabled | bool

- name: Ensure Incus starts after Docker
  ansible.builtin.copy:
    dest: /etc/systemd/system/incus.service.d/10-despues-de-docker.conf
    content: |
      # Gestionado por Ansible (vms_alumnos): el puerto de métricas escucha en la IP
      # de docker0, que existe recién cuando Docker arrancó.
      [Unit]
      After=docker.service
      Wants=docker.service
    owner: root
    group: root
    mode: "0644"
  register: vms_incus_dropin
  when: vms_alumnos_metrics_enabled | bool

- name: Reload systemd after the Incus drop-in
  ansible.builtin.systemd:
    daemon_reload: true
  when: vms_alumnos_metrics_enabled | bool and vms_incus_dropin is changed

- name: Read the current Incus metrics address
  ansible.builtin.command: incus config get core.metrics_address
  register: vms_metrics_addr
  changed_when: false
  when: vms_alumnos_metrics_enabled | bool

- name: Expose Incus metrics on the docker0 address
  ansible.builtin.command:
    argv: [incus, config, set, core.metrics_address, "{{ vms_alumnos_metrics_address }}"]
  when:
    - vms_alumnos_metrics_enabled | bool
    - vms_metrics_addr.stdout | trim != vms_alumnos_metrics_address
  changed_when: true

# Los contenedores llegan al host por INPUT, que UFW niega por defecto. Se abre el
# puerto solo hacia la IP de docker0 y solo desde las redes de Docker. Otros
# contenedores también lo alcanzan, pero sin el certificado de cliente no leen nada.
- name: Let Prometheus (Docker networks) reach the Incus metrics port
  community.general.ufw:
    rule: allow
    src: "172.16.0.0/12"
    dest: "{{ vms_alumnos_metrics_address.split(':')[0] }}"
    port: "{{ vms_alumnos_metrics_address.split(':')[1] }}"
    proto: tcp
    comment: "Prometheus: métricas de Incus (VMs alumnos)"
  when: vms_alumnos_metrics_enabled | bool

# Si Prometheus arrancó antes de que existieran los certificados, el job "incus"
# quedó sin crear y no se reintenta solo. En vez de adivinar cuándo hace falta,
# se le pregunta: si "incus" no está entre sus targets activos, se le pide que
# relea la configuración. Si Prometheus no está corriendo, no pasa nada.
- name: Check whether Prometheus is scraping Incus
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/targets
    return_content: true
  register: vms_prom_targets
  failed_when: false
  when: vms_alumnos_metrics_enabled | bool

- name: Ask Prometheus to reload (Incus job missing)
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/reload
    method: POST
  failed_when: false
  changed_when: true
  when:
    - vms_alumnos_metrics_enabled | bool
    - vms_prom_targets.status | default(0) == 200
    - '"\"job\":\"incus\"" not in vms_prom_targets.content | default("")'
