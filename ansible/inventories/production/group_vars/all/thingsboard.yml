---
# ThingsBoard en producción (ver docs/thingsboard.md). Prendido el 15/10/2026,
# con la temperatura ya resuelta (59 °C con la CPU al 82 %).
thingsboard_enabled: true

# Publicación en internet (nodo Tailscale "tableros"). Requiere la auth key en
# /etc/thingsboard/secrets/tailscale.authkey la primera vez.
thingsboard_publico_enabled: true

# Proyectos del aula que se publican (por defecto, todo privado).
thingsboard_proyectos_publicos: []

# Equipos que administran su propio espacio en ThingsBoard (tenant propio).
# Authelia: usuario y clave del aula. ThingsBoard: <usuario>@isft238.local y la
# clave de /etc/thingsboard/secrets/tb-usuario-<usuario>.pass.
thingsboard_equipos_admin:
  - { equipo: equipo-01, usuarios: [dardo] }

# Espacios propios: proyectos que no son del aula, administrados por su dueño.
# El pañol es de Lucas, no del ISFT: tenant aparte, con su usuario y una
# cuenta de servicio para el sincronizador del pañol (servicio sync-tb).
thingsboard_espacios_propios:
  - id: panol-iot
    titulo: "Pañol IoT"
    admins:
      - {id: lucas, email: "resourceldg@gmail.com", nombre: "Lucas", apellido: "Gómez"}
    servicio: "panol-sync@panol.local"
