# Classroom team roster (production). Onboarding/offboarding = edit this list and
# re-apply `--tags classroom`. Members must be valid Linux usernames.
classroom_teams:
  - name: equipo-01
    members: [jessi, dardo]
  - name: equipo-02
    members: [alan, gabi]
  - name: equipo-03
    members: [santi, mijael, gino]
  - name: equipo-04
    members: [mariano, jorge]
  - name: equipo-05
    members: [guido]

# SSO users (Authelia). Groups: operators (see everything), students (Grafana
# viewer + dashboard), family (only public apps). Passwords go in the vault
# (vault_sso_passwords), one entry per username here.
sso_users:
  - { username: operator, displayname: "Operador", email: "resourceldg@gmail.com", groups: [operators] }
  - { username: jessi, displayname: "Jessi", groups: [students] }
  - { username: alan, displayname: "Alan", groups: [students] }
  - { username: gabi, displayname: "Gabi", groups: [students] }
  - { username: santi, displayname: "Santi", groups: [students] }
  - { username: mijael, displayname: "Mijael", groups: [students] }
  - { username: gino, displayname: "Gino", groups: [students] }
  - { username: mariano, displayname: "Mariano", groups: [students] }
  - { username: jorge, displayname: "Jorge", groups: [students] }
  - { username: guido, displayname: "Guido", groups: [students] }
  - { username: dardo, displayname: "Dardo", groups: [students] }

# Operator-controlled ingress. Nothing is public until you add an entry with
# enabled: true and re-apply `--tags publish`. `service`/`port` name the compose
# service and container port in the team's project.
student_exposures: []
  # equipo-01 se accede por túnel SSH sobre Tailscale (Node-RED 1880 / MQTT 1883
  # quedan en loopback, no se publican). Ejemplo de publicación HTTP por Caddy:
  # - team: equipo-01
  #   hostname: equipo01.lucasland.duckdns.org
  #   service: web
  #   port: 8080
  #   enabled: true

# VMs propias con root (rol vms_alumnos, `--tags vms`). Cada alumno entra a la
# suya con su llave, saltando por homelab-01:  ssh -J <usuario>@homelab-01 <usuario>@<ip>
# La VM solo sale a internet: no ve la LAN, ni Docker, ni el tailnet.
# Sin ssh_pubkeys la VM NO se crea (el rol avisa). Ver docs/vms-alumnos.md.
vms_alumnos:
  - name: vm-alan
    owner: alan
    ip: 10.90.0.10
    ssh_pubkeys: []   # pendiente: pegar acá el contenido de ~/.ssh/id_ed25519.pub de Alan
