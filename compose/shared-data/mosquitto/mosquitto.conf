# Broker MQTT del aula (mqtt-aula).
#
# Estático: lo copia el rol shared_services. Lo que cambia con el roster
# —usuarios y permisos— vive en `passwd` y `acl`, generados por el rol.

listener 1883

# CERRADO por diseño: este broker sale a internet por Funnel. Cada equipo usa
# su credencial (MQTT_USER / MQTT_PASSWORD de su .shared-services.env) y la ACL
# lo encierra en su propio árbol de topics, así un equipo no ve ni pisa a otro.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Los mensajes retenidos (p. ej. el último comando de un LED) sobreviven un
# reinicio del broker: la ESP32 que reconecta recupera el estado.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

max_queued_messages 1000
max_packet_size 65536

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%d %H:%M:%S
