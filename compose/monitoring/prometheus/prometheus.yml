---
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: homelab

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # VMs de alumnos (Incus). TLS con certificado de cliente de tipo "metrics" y
  # verificación del certificado del servidor. Los archivos los crea el rol
  # vms_alumnos (--tags vms); hasta entonces este target figura caído.
  - job_name: incus
    metrics_path: /1.0/metrics
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/incus/incus-server.crt
      cert_file: /etc/prometheus/incus/client.crt
      key_file: /etc/prometheus/incus/client.key
      server_name: homelab-01
    static_configs:
      - targets: ["172.17.0.1:8444"]
