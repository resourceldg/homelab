---
# Capa de visualización IoT del aula. Operador, NO es un stack de alumnos.
#
#   ESP32 ──► mqtt-aula ──► telegraf ──► victoriametrics ◄── grafana-aula ◄── Caddy (SSO)
#                  └──────► mosquitto-exporter ──┘ (scrape)
#
# Por qué un Grafana APARTE del de operación: el Grafana gratuito no puede
# impedir que quien edita un dashboard consulte cualquier datasource. Los
# alumnos editan sus dashboards, y el Grafana de operación tiene la base de
# auditoría del pañol. Dos instancias = aislamiento real, no por convención.
name: aula-iot

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    container_name: aula-victoriametrics
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${AULA_RETENCION}"
      - "-promscrape.config=/etc/vm/scrape.yml"
      # Topes contra una placa que inventa topics en un bucle: sin esto, un
      # error de un alumno puede crear millones de series y tumbar la base.
      - "-maxLabelsPerTimeseries=8"
      - "-search.maxUniqueTimeseries=50000"
      - "-storage.maxDailySeries=20000"
    volumes:
      - vm_data:/storage
      - ./victoriametrics/scrape.yml:/etc/vm/scrape.yml:ro
    networks: [aula-iot, classroom-shared]
    ports:
      - "127.0.0.1:8428:8428"     # solo para depurar desde el host
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }

  telegraf:
    image: telegraf:1.32-alpine
    container_name: aula-telegraf
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./telegraf/mqtt.star:/etc/telegraf/mqtt.star:ro
    networks: [aula-iot, classroom-shared]
    depends_on: [victoriametrics]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  mosquitto-exporter:
    image: sapcc/mosquitto-exporter:0.8.0
    container_name: aula-mosquitto-exporter
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      BROKER_ENDPOINT: "tcp://mqtt-aula:1883"
      MQTT_USER: "aula-exporter"
      MQTT_PASS: "${AULA_EXPORTER_MQTT_PASS}"
    networks: [classroom-shared]
    deploy:
      resources:
        limits: { cpus: "0.10", memory: 64M }

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana-aula
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      GF_SERVER_ROOT_URL: "https://${AULA_GRAFANA_DOMAIN}"
      GF_SECURITY_ADMIN_USER: "${AULA_GRAFANA_ADMIN}"
      GF_SECURITY_ADMIN_PASSWORD: "${AULA_GRAFANA_ADMIN_PASSWORD}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Viewer"
      GF_USERS_DEFAULT_LANGUAGE: "es-ES"
      # Login = el de Authelia. Grafana confía en el header Remote-User SOLO si
      # viene de la red caddy<->grafana-aula (whitelist). Cualquier otro origen
      # que mande ese header es rechazado: así nadie se hace pasar por otro.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "Remote-User"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_HEADERS: "Name:Remote-Name Email:Remote-Email"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: "${AULA_PROXY_SUBNET}"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Dashboards públicos (link sin login) para la muestra: los habilita el
      # operador dashboard por dashboard. Ver docs/aula-iot.md.
      GF_PUBLIC_DASHBOARDS_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [aula-iot, grafana-aula-proxy]
    ports:
      - "127.0.0.1:3001:3000"     # API para Ansible (alta de usuarios/equipos)
    depends_on: [victoriametrics]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }

networks:
  aula-iot:
  classroom-shared:
    external: true
  grafana-aula-proxy:
    external: true

volumes:
  vm_data:
  grafana_data:
